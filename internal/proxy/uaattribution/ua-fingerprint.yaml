# User-Agent → app_slug fingerprint table.
#
# Why this file exists: OAuth direct-call path (/v1/...) doesn't carry an
# app context, so without UA inspection the usage-by-key report renders
# every session under the same email with no way to tell which client
# generated the traffic. See:
#   - workflow/CI/requirements/2026-05-26-usage-by-key-app-attribution.md
#   - workflow/CI/bugfix/20260526-usage-by-key-duplicate-rows-by-app-attribution.md
#
# Trust model: UA is client-controlled and can be spoofed. This signal is
# advisory only — it never affects routing, auth, or billing. Used purely
# for the per-app attribution dimension in the usage-by-key dashboard.
#
# Matching rule: case-sensitive prefix match against the raw User-Agent
# header value, evaluated in declared order. First match wins. If no
# rule matches (or UA is empty) the matcher returns `fallback_slug`.
#
# Adding a new client: add a new entry in `rules` with the shortest
# stable prefix that uniquely identifies that client. Keep slugs in
# kebab-case (matches the conventions already used by registered app
# slugs like `degrade-detector` and `claude-mem-spike`).

rules:
  - prefix: "claude-cli/"
    slug: "claude-code"
    # Official Anthropic Claude Code CLI. Format: claude-cli/<semver> (<edition>).

  - prefix: "cursor/"
    slug: "cursor"
    # Cursor IDE's built-in AI client.

  - prefix: "Cursor/"
    slug: "cursor"
    # Capitalized variant observed in some Cursor versions.

  - prefix: "cline/"
    slug: "cline"
    # Cline (formerly Claude Dev) VSCode extension.

  - prefix: "Cline/"
    slug: "cline"

  - prefix: "Continue/"
    slug: "continue"
    # Continue.dev IDE extension.

  - prefix: "Codex Desktop/"
    slug: "codex-desktop"
    # OpenAI Codex DESKTOP app (Microsoft Store / standalone GUI), a
    # different binary from the CLI. Format:
    #   Codex Desktop/<codex-core-semver> (<os>; <arch>) unknown (Codex Desktop; <app-version>)
    # Verified live 2026-07-23 on the Win10 guest from the proxy's
    # ua-attribution WARN log:
    #   "Codex Desktop/0.144.5 (Windows 10.0.19045; x86_64) unknown (Codex Desktop; 26.707.91948)"
    #
    # Why this needs its own rule rather than a "Codex" catch-all: the
    # prefix is capitalized AND contains a space, so it matches none of
    # the CLI patterns below (matching is case-sensitive, anchored at
    # start). Desktop traffic was bucketing to "unknown-app".
    #
    # Why its own SLUG (not merged into "codex" like the CLI faces):
    # desktop and CLI are separate surfaces with different usage shapes,
    # and the dashboard already distinguishes surfaces of one vendor
    # (claude vs claude-code). Decision 2026-07-23.
    #
    # MUST stay ABOVE any future generic "Codex"/"codex" rule — first
    # match wins, so a broader prefix placed earlier would swallow this.

  - prefix: "codex-tui/"
    slug: "codex"
    # OpenAI Codex CLI, interactive TUI mode — the ACTUAL client UA.
    # Format: codex-tui/<semver> (...). Verified live 2026-06-05 from the
    # proxy's ua-attribution WARN log; the older "codex/" guess below
    # never matched the real client, so codex traffic was bucketing to
    # "unknown-app".

  - prefix: "codex_exec/"
    slug: "codex"
    # OpenAI Codex CLI, NON-interactive `codex exec` mode. Same binary as
    # codex-tui, different UA. Verified live 2026-07-23 on the Win10 guest:
    #   "codex_exec/0.144.5 (Windows 10.0.19045; x86_64) unknown (codex_exec; 0.144.5)"
    # Note the UNDERSCORE — "codex_exec/" does not start with "codex/",
    # so the forward-compat rule below never covered it. Deliberately
    # shares the "codex" slug with codex-tui: both are the CLI surface,
    # only the invocation mode differs. Decision 2026-07-23.

  - prefix: "codex/"
    slug: "codex"
    # Older / hypothetical Codex CLI UA — kept for forward-compat.

  - prefix: "openai-cli/"
    slug: "codex"

# Fallback when no rule matches. Surfaced in the UI as "Unknown App".
# Never write an empty string downstream — empty would collide with the
# semantics of "no app context at all" which is no longer reachable on
# the OAuth direct path once this matcher is wired in.
fallback_slug: "unknown-app"
